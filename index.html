<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Mejorada</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header con controles adicionales -->
        <div class="app-header">
            <h1><i class="fas fa-calculator"></i> Calculadora</h1>
            <div class="header-controls">
                <button class="theme-toggle" id="theme-toggle" title="Cambiar tema">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="sound-toggle" id="sound-toggle" title="Sonido">
                    <i class="fas fa-volume-up"></i>
                </button>
            </div>
        </div>

        <div class="calculator">
            <!-- Display original (sin cambios) -->
            <div class="display">
                <div class="previous-operand"></div>
                <div class="current-operand">0</div>
                <!-- Indicador de memoria añadido -->
                <div class="memory-indicator" id="memory-indicator">
                    <i class="fas fa-memory"></i>
                </div>
            </div>

            <!-- Memoria rápida (nueva fila) -->
            <div class="memory-buttons">
                <button class="btn btn-memory" id="mc">MC</button>
                <button class="btn btn-memory" id="mr">MR</button>
                <button class="btn btn-memory" id="m-plus">M+</button>
                <button class="btn btn-memory" id="m-minus">M-</button>
                <button class="btn btn-memory" id="ms">MS</button>
            </div>

            <!-- Botones originales (sin cambios) -->
            <div class="buttons">
                <button class="btn btn-clear span-2">AC</button>
                <button class="btn btn-delete">DEL</button>
                <button class="btn btn-operator">÷</button>
                
                <button class="btn btn-number">7</button>
                <button class="btn btn-number">8</button>
                <button class="btn btn-number">9</button>
                <button class="btn btn-operator">×</button>
                
                <button class="btn btn-number">4</button>
                <button class="btn btn-number">5</button>
                <button class="btn btn-number">6</button>
                <button class="btn btn-operator">-</button>
                
                <button class="btn btn-number">1</button>
                <button class="btn btn-number">2</button>
                <button class="btn btn-number">3</button>
                <button class="btn btn-operator">+</button>
                
                <button class="btn btn-number span-2">0</button>
                <button class="btn btn-number">.</button>
                <button class="btn btn-equals">=</button>
            </div>

            <!-- Funciones extras (nuevos botones) -->
            <div class="extra-functions">
                <button class="btn btn-extra" id="btn-percent">%</button>
                <button class="btn btn-extra" id="btn-square">x²</button>
                <button class="btn btn-extra" id="btn-sqrt">√</button>
                <button class="btn btn-extra" id="btn-plusminus">+/-</button>
            </div>

            <!-- Historial original (sin cambios) -->
            <div class="history">
                <div class="history-header">
                    <h3><i class="fas fa-history"></i> Historial</h3>
                    <div class="history-controls">
                        <button class="btn-history" id="toggle-history" title="Mostrar/ocultar">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn-history" id="export-history" title="Exportar">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                </div>
                <div class="history-list"></div>
                <div class="history-footer">
                    <span id="history-count">0 operaciones</span>
                    <button class="btn-clear-history">Limpiar Historial</button>
                </div>
            </div>
        </div>

        <!-- Notificaciones flotantes -->
        <div class="notification" id="notification"></div>
        
        <!-- Panel de información -->
        <div class="info-panel">
            <h4><i class="fas fa-keyboard"></i> Atajos de teclado</h4>
            <div class="shortcuts">
                <div><kbd>0-9</kbd> Números</div>
                <div><kbd>+ - * /</kbd> Operaciones</div>
                <div><kbd>Enter</kbd> Calcular</div>
                <div><kbd>Esc</kbd> Limpiar</div>
                <div><kbd>Del</kbd> Borrar</div>
                <div><kbd>Ctrl+M</kbd> Memoria</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
